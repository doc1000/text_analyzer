#version: "3.9"
# generated by ChatGPT Vault Space
# small file that enables some dev options like --reload, a volume
# changes the base compose file so no need to update both code base


services:
  backend:
    volumes:
      - ./app:/code/app
      - .:/code  # Mount project root so test scripts are accessible
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
  
  jupyter:
    build:
      context: .
      target: dev
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    volumes:
      - .:/app
      - .:/code  # Mount project root so test scripts are accessible
    ports:
      - "8888:8888"
