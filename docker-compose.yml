#version: "3.9"
# generated by ChatGPT VaultBubble Space
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badgerpass
      POSTGRES_DB: badgerdb
    ports:
      - "5433:5432"  # host:container (5433 so it doesn't collide with any local Postgres)
    volumes:
      - badger_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://badger:badgerpass@db:5432/badgerdb
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  badger_db_data:
