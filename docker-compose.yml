#version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badgerpass
      POSTGRES_DB: badgerdb
    ports:
      - "5433:5432"  # host:container
    volumes:
      - badger_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./migrations:/migrations:ro

  # Ollama services are in the "ollama" profile - only start when needed:
  #   docker compose --profile ollama up
  # For cloud providers (OpenAI), just use:
  #   docker compose up
  ollama:
    image: ollama/ollama:0.13.5
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # One-shot model seeder: pulls models into the shared ollama_models volume
  ollama_seed:
    image: curlimages/curl:8.5.0
    profiles: ["ollama"]
    depends_on:
      - ollama
    restart: "no"
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh","-lc"]
    command: >
      "echo 'Waiting for Ollama...' &&
       until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 1; done &&
       echo 'Seeding models...' &&
       curl -s http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\":\"all-minilm\"}' >/dev/null &&
       curl -s http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\":\"phi3.5-mini-q2k\"}' >/dev/null &&
       echo 'Done seeding.'"


  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://badger:badgerpass@db:5432/badgerdb

      # Cloud-like config: HuggingFace for embeddings, OpenAI for chat/topics
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL: all-minilm
      EMBEDDING_DIM: 384
      CHAT_PROVIDER: openai
      TOPIC_PROVIDER: openai

    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  badger_db_data:
  ollama_models:
