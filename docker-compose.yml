#version: "3.9"
# generated by ChatGPT Badger Space
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: badger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badgerpass
      POSTGRES_DB: badgerdb
    ports:
      - "5433:5432"  # host:container (5433 so it doesn't collide with any local Postgres)
    volumes:
      - badger_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: .
    container_name: badger_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env        # <-- this loads OPENAI_API_KEY and other secrets
    environment:
      # SQLAlchemy-style URL; adjust to your taste
      DATABASE_URL: postgresql+psycopg2://badger:badgerpass@db:5432/badgerdb
      # Or plain Postgres URL if you're not using SQLAlchemy:
      # DATABASE_URL: postgres://badger:badgerpass@db:5432/badgerdb
    ports:
      - "8000:8000"  # FastAPI on localhost:8000
    restart: unless-stopped
    volumes:
      - ./app:/code/app

volumes:
  badger_db_data:
