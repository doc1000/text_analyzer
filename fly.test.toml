# fly.toml app configuration file for vaultbubbles
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vaultbubbles-test'
primary_region = 'sjc'

[build]

[env]
  PORT = "8000"
  API_BASE = "https://vaultbubbles-test.fly.dev"
[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
