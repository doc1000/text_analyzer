<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Trust Badger Capture</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0.5rem 0.6rem;
      background: #020617;
      color: #e5e7eb;
      width: 340px;
    }
    h1 {
      font-size: 0.95rem;
      margin: 0 0 0.4rem 0;
    }
    label {
      font-size: 0.78rem;
      display: block;
      margin-top: 0.4rem;
      margin-bottom: 0.1rem;
    }
    input[type="text"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
      padding: 0.35rem 0.4rem;
    }
    textarea {
      min-height: 80px;
      max-height: 180px;
      resize: vertical;
    }
    #url-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
      font-size: 0.78rem;
    }
    #buttons {
      margin-top: 0.6rem;
      display: flex;
      gap: 0.4rem;
      justify-content: space-between;
      align-items: center;
    }
    #btn-save {
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #e5e7eb;
      font-size: 0.78rem;
      cursor: pointer;
    }
    #btn-save:hover {
      background: #1f2937;
    }
    #btn-fullpage {
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.72rem;
      cursor: pointer;
    }
    #btn-fullpage:hover {
      background: #111827;
    }
    #status {
      margin-top: 0.35rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>Trust Badger Capture</h1>

  <label for="tb-header">Header / notes</label>
  <textarea id="tb-header" placeholder="Your note or title for this capture..."></textarea>

  <label for="tb-body">Selected text (optional)</label>
  <textarea id="tb-body" placeholder="Highlight text on the page, then open this popup. You can also paste or type here."></textarea>

  <label for="tb-tags">Tags (comma-separated)</label>
  <input id="tb-tags" type="text" placeholder="research, security, idea" />

  <div id="url-row">
    <input type="checkbox" id="tb-tie-url" checked />
    <label for="tb-tie-url">Tie to page URL</label>
  </div>

  <div id="buttons">
    <button id="btn-fullpage" type="button">Capture full page</button>
    <button id="btn-save" type="button">Save as a note</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
