<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trust Badger Vault</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    header .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      font-size: 0.9rem;
    }

    header input[type="number"],
    header select {
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      border: 1px solid #4b5563;
      background: #1e2546;
      color: #e5e7eb;
      font-size: 0.85rem;
    }

    header input[type="number"] {
      width: 4rem;
    }

    header button {
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }

    header button:hover {
      background: #1f2937;
    }

    main {
      padding: 0;
      margin: 0;
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: row;
    }

    #bubble-container {
      flex: 1;
      position: relative;
      background: #e5e9f1;
    }

    #bubble-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    #info-panel {
      width: 320px;
      max-width: 40vw;
      border-left: 1px solid #1f2937;
      padding: 0.75rem 0.9rem;
      box-sizing: border-box;
      font-size: 0.9rem;
      background: #020617;
      overflow-y: auto;
    }

    #info-panel h2 {
      font-size: 1rem;
      margin: 0 0 0.4rem 0;
    }

    #info-panel h3 {
      font-size: 0.95rem;
      margin: 0.6rem 0 0.3rem 0;
    }

    #info-panel p {
      margin: 0 0 0.4rem 0;
      line-height: 1.3;
    }

    #info-panel .meta {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      padding: 0.3rem 0.45rem;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid #4b5563;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.3rem;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Trust Badger · Topic Map</h1>
    <div class="controls">
      <span>Days:</span>
      <input type="number" id="daysInput" value="30" min="1" max="365" />

      <!-- NEW: visualization mode selector -->
      <span>Viz:</span>
      <select id="vizMode">
        <option value="classic" selected>Classic</option>
        <option value="multicolor">Multicolored</option>
      </select>

      <button id="reloadBtn">Reload</button>
      <span class="hint">Click big bubbles to zoom · click document bubbles to open</span>
    </div>
  </header>

  <main>
    <div id="bubble-container">
      <svg id="bubble-svg"></svg>
      <div id="tooltip"></div>
    </div>
    <aside id="info-panel">
      <h2>Topic Details</h2>
      <p>Select a topic, subtopic, or document bubble to see more information.</p>
      <div id="info-content"></div>
    </aside>
  </main>

  <!-- D3 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script>
    const API_BASE = "http://localhost:8000"; // adjust if needed

    const svg = d3.select("#bubble-svg");
    const width = svg.node().clientWidth || 800;
    const height = svg.node().clientHeight || 600;

    const tooltip = d3.select("#tooltip");
    const infoContent = document.getElementById("info-content");

    const topicColorScale = d3.scaleOrdinal(d3.schemeTableau10);

    let rootNode;
    let focusNode;
    let view;

    let nodeGroup;     // holds circle groups
    let labelGroup;    // holds labels
    let node;          // selection of g.node
    let circle;        // selection of circles
    let labels;        // selection of text labels

    function updateInfoPanel(d) {
      const data = d.data;
      infoContent.innerHTML = "";

      const el = document.createElement("div");

      const title = document.createElement("h3");
      title.textContent = data.name || "(no name)";
      el.appendChild(title);

      if (data.summary) {
        const summaryP = document.createElement("p");
        summaryP.textContent = data.summary;
        el.appendChild(summaryP);
      }

      if (data.url) {
        const meta = document.createElement("div");
        meta.className = "meta";
        const a = document.createElement("a");
        a.href = data.url;
        a.target = "_blank";
        a.textContent = "Open document";
        meta.appendChild(a);

        if (data.score_info != null || data.score_ai_slop != null) {
          const scores = document.createElement("div");
          scores.textContent = ` info: ${data.score_info ?? ""} · ai slop: ${data.score_ai_slop ?? ""}`;
          meta.appendChild(scores);
        }

        if (data.captured_at) {
          const dt = document.createElement("div");
          const dateStr = new Date(data.captured_at).toLocaleString();
          dt.textContent = ` captured: ${dateStr}`;
          meta.appendChild(dt);
        }

        el.appendChild(meta);
      } else {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = "Aggregated topic / subtopic";
        el.appendChild(meta);
      }

      infoContent.appendChild(el);
    }

    function showTooltip(event, d) {
      const data = d.data;
      let line = data.name || "";
      tooltip.text(line);
      const [x, y] = d3.pointer(event);
      const containerRect = document.getElementById("bubble-container").getBoundingClientRect();

      tooltip
        .style("left", (containerRect.left + x + 16) + "px")
        .style("top", (containerRect.top + y + 16) + "px")
        .style("opacity", 1);
    }

    function hideTooltip() {
      tooltip.style("opacity", 0);
    }

    function findTopicAncestor(d) {
      const anc = d.ancestors().find(a => a.depth === 1);
      return anc || d;
    }

    // Same-family colors, darker at top, lighter down
    function colorByTopicDepth(d) {
      const topicNode = findTopicAncestor(d);
      const baseName = topicNode.data.topic_id || topicNode.data.name || "default";
      let base = topicColorScale(baseName);
      let c = d3.color(base) || d3.color("#4b5563");

      if (d.depth === 1) {
        return c.formatHex();
      } else if (d.depth === 2) {
        return c.brighter(0.6).formatHex();
      } else {
        return c.brighter(1.2).formatHex();
      }
    }

    function zoomTo(v) {
      const k = width / (v[2] * 2);
      view = v;

      const transform = d =>
        `translate(${(d.x - v[0]) * k + width / 2},${(d.y - v[1]) * k + height / 2})`;

      node.attr("transform", transform);
      circle.attr("r", d => d.r * k);
      labels.attr("transform", transform);
    }

    function zoom(d) {
      focusNode = d;

      const transition = svg.transition()
        .duration(750)
        .tween("zoom", () => {
          const i = d3.interpolateZoom(view, [focusNode.x, focusNode.y, focusNode.r * 2]);
          return t => zoomTo(i(t));
        });

      // NEW: when zoomed into a node, show labels for its children only (no label for the parent bubble)
      transition.selectAll("text.label")
        .style("opacity", n => (n.parent === d) ? 1 : 0)
        .on("end", function(n) {
          this.style.display = (n.parent === d) ? "inline" : "none";
        });
    }

    // Multi-line wrapping helper
    function wrapLabel(selection, maxChars) {
      selection.each(function(d) {
        const text = d3.select(this);
        const full = text.text();
        const words = full.split(/\s+/).filter(Boolean);

        if (full.length <= maxChars || words.length <= 1) {
          return;
        }

        text.text(null);

        let line = [];
        let lineNumber = 0;
        const lineHeight = 1.1; // em
        const y = 0;
        const dy = parseFloat(text.attr("dy")) || 0;
        let tspan = text.append("tspan")
          .attr("x", 0)
          .attr("y", y)
          .attr("dy", dy + "em");

        for (const word of words) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.text().length > maxChars && line.length > 1) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            lineNumber += 1;
            tspan = text.append("tspan")
              .attr("x", 0)
              .attr("y", y)
              .attr("dy", (dy + lineNumber * lineHeight) + "em")
              .text(word);
          }
        }
      });
    }

    async function renderBubbleMap(days = 30) {
      svg.selectAll("*").remove(); // clear
      tooltip.style("opacity", 0);
      infoContent.innerHTML = "<p>Loading topics…</p>";

      const res = await fetch(`${API_BASE}/topics/hierarchy?days=${days}`);
      const data = await res.json();

      const root = d3.hierarchy(data)
        .sum(d => d.size || 1)
        .sort((a, b) => (b.value || 0) - (a.value || 0));

      const pack = d3.pack()
        .size([width, height])
        .padding(4);

      const packedRoot = pack(root);
      rootNode = packedRoot;
      focusNode = packedRoot;
      view = [rootNode.x, rootNode.y, rootNode.r * 2];

      const nodes = rootNode.descendants().filter(d => d.depth > 0); // skip root

      // Layers: circles then labels
      nodeGroup = svg.append("g").attr("class", "nodes");
      labelGroup = svg.append("g").attr("class", "labels");

      node = nodeGroup.selectAll("g.node")
        .data(nodes)
        .join("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x},${d.y})`);

      circle = node.append("circle")
        .attr("class", "bubble")
        .attr("r", d => d.r)
        .attr("fill", d => colorByTopicDepth(d))
        .attr("fill-opacity", d => {
          if (d.depth === 1) return 0.9;
          if (d.depth === 2) return 0.75;
          return 0.6;
        })
        .attr("stroke", "rgba(0,0,0,0.15)")
        .attr("stroke-width", 0.5)
        .on("mouseover", (event, d) => showTooltip(event, d))
        .on("mouseout", hideTooltip)
        .on("click", (event, d) => {
          event.stopPropagation();
          const hasChildren = !!d.children && d.children.length > 0;
          if (hasChildren) {
            zoom(d);
            updateInfoPanel(d);
          } else if (d.data.url) {
            window.open(d.data.url, "_blank");
            updateInfoPanel(d);
          } else {
            updateInfoPanel(d);
          }
        });

      // Labels: separate layer, styled to pop on any background
      labels = labelGroup.selectAll("text.label")
        .data(nodes)
        .join("text")
        .attr("class", "label")
        .attr("text-anchor", "middle")
        // Shift baseline upward so labels sit closer to the top of circles
        .attr("dy", d => d.depth === 1 ? "-0.9em" : "-0.9em")
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .style("pointer-events", "none")
        // Inverted colors: dark text with light outline
        //.style("fill", "#f9fafb")          // dark fill #020617
        .style("fill", "#020617")          // dark fill #020617
        //.style("stroke", "#020617")        // light outline #f9fafb
        .style("stroke-width", d => d.depth === 1 ? 2 : 1.5)
        .style("paint-order", "stroke fill") // draw outline first, then fill
        .style("font-size", d => d.depth === 1 ? "0.9rem" : "0.9rem")
        // Initial: show only top-level topic labels
        .style("display", d => d.depth === 1 ? "inline" : "none")
        .style("opacity", d => d.depth === 1 ? 1 : 0)
        .text(d => {
          const raw = d.data.name || "";
          // Remove trailing " (number)" from the label, e.g. "Topic Name (7)" -> "Topic Name"
          return raw.replace(/\s*\(\d+\)\s*$/, "");
        });

      // Wrap labels to multiple lines if needed
      labels.call(wrapLabel, 16);

      // Ensure labels are above nodes
      labelGroup.raise();


      zoomTo([rootNode.x, rootNode.y, rootNode.r * 2]);
      infoContent.innerHTML = "<p>Click a topic bubble to see details. Zoom in to see subtopics.</p>";

      // Reset zoom & labels on background click: restore top-level labels only
      svg.on("click", () => {
        focusNode = rootNode;
        const transition = svg.transition()
          .duration(750)
          .tween("zoom", () => {
            const i = d3.interpolateZoom(view, [rootNode.x, rootNode.y, rootNode.r * 2]);
            return t => zoomTo(i(t));
          });

        transition.selectAll("text.label")
          .style("opacity", d => d.depth === 1 ? 1 : 0)
          .on("end", function(d) {
            this.style.display = d.depth === 1 ? "inline" : "none";
          });

        infoContent.innerHTML = "<p>Click a topic, subtopic, or document bubble to see details.</p>";
      });
    }

    const daysInput = document.getElementById("daysInput");
    const reloadBtn = document.getElementById("reloadBtn");
    if (reloadBtn) {
      reloadBtn.addEventListener("click", () => {
        const days = parseInt(daysInput.value, 10) || 30;
        renderBubbleMap(days);
      });
    }

    renderBubbleMap(30);
  </script>


</body>
</html>
