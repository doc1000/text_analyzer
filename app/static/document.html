<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Document Viewer - VaultBubble</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    button {
      padding: 0.3rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #e5e7eb;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button:hover {
      background: #1f2937;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    main {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    #documentTitle {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #020617;
      color: #e5e7eb;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      box-sizing: border-box;
    }

    #documentTitle:focus {
      outline: none;
      border-color: #60a5fa;
    }

    #documentMeta {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1f2937;
    }

    #documentMeta a {
      color: #60a5fa;
      text-decoration: none;
    }

    #documentMeta a:hover {
      text-decoration: underline;
    }

    #documentBody {
      width: 100%;
      min-height: 400px;
      padding: 0.75rem;
      border: 1px solid #374151;
      border-radius: 6px;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.6;
      font-family: inherit;
      white-space: pre-wrap;
      box-sizing: border-box;
      resize: vertical;
    }

    #documentBody:focus {
      outline: none;
      border-color: #60a5fa;
    }

    .save-status {
      font-size: 0.85rem;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
    }

    .save-status.unsaved {
      color: #fbbf24;
    }

    .save-status.saving {
      color: #60a5fa;
    }

    .save-status.saved {
      color: #10b981;
    }

    .save-status.error {
      color: #ef4444;
    }

    .section-label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .delete-btn {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fca5a5;
    }

    .delete-btn:hover {
      background: #991b1b;
      border-color: #7f1d1d;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background-color: #111827;
      margin: 15% auto;
      padding: 0;
      border: 1px solid #374151;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: #e5e7eb;
    }

    .modal-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      color: #e5e7eb;
    }

    .modal-body {
      padding: 1.5rem;
      color: #d1d5db;
    }

    .modal-body p {
      margin: 0 0 1rem 0;
      line-height: 1.6;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #374151;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .modal-btn-danger {
      background: #7f1d1d;
      border-color: #991b1b;
      color: #fca5a5;
    }

    .modal-btn-danger:hover {
      background: #991b1b;
      border-color: #7f1d1d;
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="/static/icon.svg" alt="V" style="height: 2.6rem; vertical-align: middle; margin-right: -0.3rem; margin-left: -0.2rem;">Document Viewer</h1>
    <div class="controls">
      <button id="saveBtn">Save</button>
      <span id="saveStatus" class="save-status"></span>
      <button id="deleteBtn" class="delete-btn">Delete</button>
    </div>
  </header>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Delete Document</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this document?</p>
        <p style="color: #9ca3af; font-size: 0.9rem;">This action cannot be undone. The document will be permanently removed from the vault and database.</p>
      </div>
      <div class="modal-footer">
        <button id="cancelDeleteBtn">Cancel</button>
        <button id="confirmDeleteBtn" class="modal-btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <main>
    <div class="section-label">Header</div>
    <input type="text" id="documentTitle" placeholder="Document title..." />

    <div id="documentMeta"></div>

    <div class="section-label">Captured</div>
    <textarea id="documentBody" placeholder="Document content..."></textarea>
  </main>

  <script>
    const API_BASE = "http://localhost:8000"; // adjust if needed

    const documentTitle = document.getElementById("documentTitle");
    const documentMeta = document.getElementById("documentMeta");
    const documentBody = document.getElementById("documentBody");
    const saveBtn = document.getElementById("saveBtn");
    const saveStatus = document.getElementById("saveStatus");
    const deleteBtn = document.getElementById("deleteBtn");
    const deleteModal = document.getElementById("deleteModal");
    const modalClose = document.getElementById("modalClose");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

    // Get document ID from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get("id");

    if (!docId) {
      documentTitle.value = "Error: No document ID provided";
      documentBody.value = "Please provide a document ID in the URL: ?id=document-id";
      documentTitle.disabled = true;
      documentBody.disabled = true;
      saveBtn.disabled = true;
    } else {
      loadDocument(docId);
    }

    let originalTitle = "";
    let originalText = "";
    let originalFullText = ""; // Store the complete original text
    let hasChanges = false;

    function extractCapturedContent(fullText) {
      // Find [Captured] marker (case-insensitive, handles variations)
      const capturedMarker = /\[captured\]/i;
      const match = fullText.match(capturedMarker);
      
      if (match) {
        // Get everything after the marker
        const startIndex = match.index + match[0].length;
        let capturedContent = fullText.substring(startIndex);
        
        // Remove leading whitespace/newlines
        capturedContent = capturedContent.replace(/^\s+/, '');
        
        return capturedContent;
      }
      
      // If no [Captured] marker found, return the full text
      return fullText;
    }

    async function loadDocument(docId) {
      documentTitle.value = "Loading…";
      documentBody.value = "";
      saveBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(docId)}`);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: Failed to load document`);
        }

        const doc = await res.json();

        originalTitle = doc.title || "";
        originalFullText = doc.text || "";
        
        // Extract only the captured content (everything after [Captured])
        const capturedContent = extractCapturedContent(originalFullText);
        originalText = capturedContent; // Store the extracted content as the "original"

        documentTitle.value = originalTitle;
        documentBody.value = capturedContent;

        const captured = doc.captured_at ? new Date(doc.captured_at).toLocaleString() : "n/a";

        // Build topic info if assigned
        let topicInfo = "";
        if (doc.assigned_topic_title) {
          topicInfo = `<div style="margin-top: 0.5rem; padding: 0.4rem 0.6rem; background: #1f2937; border-radius: 4px; display: inline-block;"><span style="color: #9ca3af;">Topic:</span> <span style="color: #60a5fa;">${doc.assigned_topic_title}</span></div>`;
        }

        documentMeta.innerHTML = `
          <div><a href="${doc.url}" target="_blank">Open source URL</a></div>
          <div>Captured: ${captured}</div>
          ${topicInfo}
        `;

        // Update page title
        document.title = `${doc.title || "Untitled"} - VaultBubble`;

        saveBtn.disabled = false;
        hasChanges = false;
        updateSaveStatus("");

      } catch (err) {
        console.error("Load error:", err);
        documentTitle.value = "Error";
        documentBody.value = "Failed to load document. See console for details.";
        updateSaveStatus("Error loading document", "error");
      }
    }

    function updateSaveStatus(message, type = "") {
      saveStatus.textContent = message;
      saveStatus.className = `save-status ${type}`;
    }

    // Track changes
    documentTitle.addEventListener("input", () => {
      hasChanges = documentTitle.value !== originalTitle || documentBody.value !== originalText;
      if (hasChanges) {
        updateSaveStatus("Unsaved changes", "unsaved");
      } else {
        updateSaveStatus("");
      }
    });

    documentBody.addEventListener("input", () => {
      hasChanges = documentTitle.value !== originalTitle || documentBody.value !== originalText;
      if (hasChanges) {
        updateSaveStatus("Unsaved changes", "unsaved");
      } else {
        updateSaveStatus("");
      }
    });

    // Save functionality
    async function saveDocument() {
      if (!docId || !hasChanges) return;

      const title = documentTitle.value.trim();
      const text = documentBody.value;

      updateSaveStatus("Saving...", "saving");
      saveBtn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(docId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: title || null,
            text: text
          })
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errorText}`);
        }

        const updatedDoc = await res.json();

        originalTitle = updatedDoc.title || "";
        originalFullText = updatedDoc.text || "";
        
        // Extract only the captured content for display
        const capturedContent = extractCapturedContent(originalFullText);
        originalText = capturedContent;

        // Update page title
        document.title = `${updatedDoc.title || "Untitled"} - VaultBubble`;

        hasChanges = false;
        updateSaveStatus("Saved", "saved");
        setTimeout(() => updateSaveStatus(""), 2000);

      } catch (err) {
        console.error("Save error:", err);
        updateSaveStatus("Error: " + err.message, "error");
      } finally {
        saveBtn.disabled = false;
      }
    }

    saveBtn.addEventListener("click", saveDocument);

    // Keyboard shortcut: Ctrl+S to save
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveDocument();
      }
    });

    // Warn before closing if there are unsaved changes
    window.addEventListener("beforeunload", (e) => {
      if (hasChanges) {
        e.preventDefault();
        e.returnValue = "You have unsaved changes. Are you sure you want to leave?";
        return e.returnValue;
      }
    });

    // Delete functionality
    function showDeleteModal() {
      deleteModal.style.display = "block";
    }

    function hideDeleteModal() {
      deleteModal.style.display = "none";
    }

    async function deleteDocument() {
      if (!docId) return;

      try {
        const res = await fetch(`${API_BASE}/documents/${encodeURIComponent(docId)}`, {
          method: "DELETE"
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errorText}`);
        }

        const result = await res.json();
        
        // Show success message briefly, then redirect
        updateSaveStatus("Document deleted", "saved");
        
        // Redirect to main page after a short delay
        setTimeout(() => {
          window.location.href = "/static/index.html";
        }, 1000);

      } catch (err) {
        console.error("Delete error:", err);
        updateSaveStatus("Error: " + err.message, "error");
        hideDeleteModal();
      }
    }

    // Event listeners for delete functionality
    deleteBtn.addEventListener("click", () => {
      if (hasChanges) {
        if (!confirm("You have unsaved changes. Do you want to delete anyway? (Changes will be lost)")) {
          return;
        }
      }
      showDeleteModal();
    });

    modalClose.addEventListener("click", hideDeleteModal);
    cancelDeleteBtn.addEventListener("click", hideDeleteModal);
    
    confirmDeleteBtn.addEventListener("click", () => {
      confirmDeleteBtn.disabled = true;
      confirmDeleteBtn.textContent = "Deleting...";
      deleteDocument();
    });

    // Close modal when clicking outside of it
    window.addEventListener("click", (e) => {
      if (e.target === deleteModal) {
        hideDeleteModal();
      }
    });
  </script>
</body>
</html>
